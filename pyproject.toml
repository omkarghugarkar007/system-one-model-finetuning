[project]
name = "frontierrank"
version = "0.2.0"
description = "Reranking that spends compute in proportion to ranking regret"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
# the model layer: Laya is ModernBERT-large + a from-scratch decision head
model = ["torch>=2.4", "transformers>=4.48", "safetensors>=0.4", "huggingface_hub>=0.25"]
# retrieval + indexing for the data layer
data  = ["datasets>=2.19", "rank-bm25>=0.2.2", "sentence-transformers>=3.0", "ir-datasets>=0.5"]
# statistics, fitted controllers, plots
eval  = ["scipy>=1.11", "lightgbm>=4.0", "matplotlib>=3.8"]
dev   = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff>=0.6"]
all   = ["frontierrank[model,data,eval,dev]"]

[project.scripts]
fr = "frontierrank.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs model weights or a corpus download",
    "network: hits an external service",
    "mps: needs Apple Silicon",
]

[tool.ruff]
line-length = 100
src = ["src"]
