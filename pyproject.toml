[project]
name = "systemone"
version = "0.3.0"
description = "A recipe for fine-tuning System One models (typed decisions with calibrated probabilities)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["system-one", "typed-decisions", "calibration", "fine-tuning",
            "laya", "jev", "modernbert", "reranking"]
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
# everything you need to fine-tune. This is the one most people want.
train = ["torch>=2.4", "transformers>=4.48", "safetensors>=0.4",
         "huggingface_hub>=0.25"]
# the reranking worked example: corpora, BM25, baselines
example = ["datasets>=2.19", "sentence-transformers>=3.0", "snowballstemmer>=2.2",
           "scipy>=1.11"]
# statistics and plots for the research
research = ["scipy>=1.11", "lightgbm>=4.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff>=0.6"]
all = ["systemone[train,example,research,dev]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs model weights or a corpus download",
    "network: hits an external service",
    "mps: needs Apple Silicon",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, simplify.
# Deliberately not the everything-ruleset: this is research code and a linter
# that cries wolf gets switched off.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter, not by failing CI
    "B008",    # function call in default arg -- intentional for numpy defaults
    "SIM108",  # ternaries are not always clearer than an if
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]   # sys.path shim must precede imports
"tests/*" = ["E402"]
# research scripts: kept runnable and readable, not held to library standards
"scripts/*" = ["E402", "E701", "E702", "E741", "B905", "B007", "F841", "C408",
               "SIM102", "B023", "C416", "E731"]
